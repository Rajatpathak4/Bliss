<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#0c1e18" />
      <stop offset="100%" stop-color="#052e22" />
    </linearGradient>
    <linearGradient id="shine" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.14" />
      <stop offset="55%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="220" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="url(#shine)" />

  <!-- Ambient glow behind shield -->
  <circle cx="256" cy="230" r="170" fill="url(#glow)" />

  <!-- Shield -->
  <path
    d="M256 84 L376 130 V244 C376 340 314 406 256 428 C198 406 136 340 136 244 V130 L256 84 Z"
    fill="none"
    stroke="white"
    stroke-width="18"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Checkmark inside shield -->
  <path
    d="M204 244 L240 280 L312 208"
    fill="none"
    stroke="white"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Small ascending tracking line beneath, echoes the growth/tracker motif -->
  <polyline
    points="150,392 210,368 270,378 340,336"
    fill="none"
    stroke="#34d399"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
  <circle cx="340" cy="336" r="12" fill="#34d399" />
</svg>
