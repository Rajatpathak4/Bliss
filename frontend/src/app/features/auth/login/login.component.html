<div class="auth-form">
  <div class="auth-brand">
    <span class="auth-brand__logo">
       <svg
        width="100"
        height="100"
        viewBox="0 0 100 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient
            id="bg"
            x1="0"
            y1="0"
            x2="100"
            y2="100"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#1E3A8A" />
            <stop offset="100%" stop-color="#0284C7" />
          </linearGradient>
          <linearGradient
            id="shine"
            x1="50"
            y1="0"
            x2="50"
            y2="100"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="white" stop-opacity="0.16" />
            <stop offset="60%" stop-color="white" stop-opacity="0" />
          </linearGradient>
          <radialGradient
            id="glow"
            cx="80"
            cy="43"
            r="14"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0" />
          </radialGradient>
        </defs>

        <!-- Tile -->
        <rect width="100" height="100" rx="22" fill="url(#bg)" />
        <rect width="100" height="100" rx="22" fill="url(#shine)" />

        <!-- Chart grid -->
        <line
          x1="12"
          y1="32"
          x2="88"
          y2="32"
          stroke="white"
          stroke-width="0.7"
          opacity="0.07"
        />
        <line
          x1="12"
          y1="52"
          x2="88"
          y2="52"
          stroke="white"
          stroke-width="0.7"
          opacity="0.07"
        />
        <line
          x1="12"
          y1="72"
          x2="88"
          y2="72"
          stroke="white"
          stroke-width="0.7"
          opacity="0.07"
        />

        <!-- Baseline axis -->
        <line
          x1="16"
          y1="81"
          x2="84"
          y2="81"
          stroke="white"
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.22"
        />

        <!-- L — vertical bar -->
        <rect x="17" y="16" width="15" height="65" rx="4.5" fill="white" />

        <!-- L — ascending arm (tracking line) -->
        <line
          x1="25"
          y1="79"
          x2="80"
          y2="43"
          stroke="white"
          stroke-width="15"
          stroke-linecap="round"
        />

        <!-- Trail data-points -->
        <circle cx="39" cy="70" r="2.2" fill="white" opacity="0.45" />
        <circle cx="52" cy="61" r="2.6" fill="white" opacity="0.62" />
        <circle cx="66" cy="52" r="3" fill="white" opacity="0.80" />

        <!-- Terminal node glow + pin -->
        <circle cx="80" cy="43" r="14" fill="url(#glow)" />
        <circle cx="80" cy="43" r="7.5" fill="white" />
        <circle cx="80" cy="43" r="3.5" fill="url(#bg)" />
      </svg>
    </span>
    <span class="auth-brand__name">LIC Tracker</span>
  </div>

  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to your dashboard</p>

  <div class="auth-toggle">
    <a class="auth-toggle__btn auth-toggle__btn--active" routerLink="/auth/login">Sign In</a>
    <a class="auth-toggle__btn" routerLink="/auth/signup">Sign Up</a>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="nx-field">
      <label class="nx-label" for="email">Email address</label>
      <div class="nx-input-wrap">
        <span class="nx-input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect><polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </span>
        <input id="email" type="email" class="nx-input" formControlName="email"
               placeholder="Email"
               [class.is-invalid]="f.email.touched && f.email.invalid" />
      </div>
      <span class="nx-error" *ngIf="f.email.touched && f.email.invalid">Enter a valid email address.</span>
    </div>

    <div class="nx-field auth-field-gap">
      <label class="nx-label" for="password">Password</label>
      <div class="nx-input-wrap">
        <span class="nx-input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </span>
        <input id="password" type="password" class="nx-input" formControlName="password"
               placeholder="password"
               [class.is-invalid]="f.password.touched && f.password.invalid" />
      </div>
      <span class="nx-error" *ngIf="f.password.touched && f.password.invalid">Password must be at least 6 characters.</span>
    </div>

    <div class="auth-forgot">
      <a routerLink="/forgot-password">Forgot password?</a>
    </div>

    <button type="submit" class="nx-btn nx-btn--primary nx-btn--block" >
      <span>Login</span>
    </button>
  </form>

  <p class="auth-terms">By continuing, you agree to our Terms of Service and Privacy Policy.</p>
</div>
