<div class="auth-form">
  <div class="auth-brand">
    <span class="auth-brand__logo">
       <img src="assets/logo.svg" alt="LIC Tracker" width="34" height="34" style="border-radius: 10px;" />
    </span>
    <span class="auth-brand__name">LIC Tracker</span>
  </div>

  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-sub">Sign in to your dashboard</p>

  <div class="auth-toggle">
    <a class="auth-toggle__btn auth-toggle__btn--active" routerLink="/auth/login">Sign In</a>
    <a class="auth-toggle__btn" routerLink="/auth/signup">Sign Up</a>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="nx-field">
      <label class="nx-label" for="email">Email address</label>
      <div class="nx-input-wrap">
        <span class="nx-input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect><polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </span>
        <input id="email" type="email" class="nx-input" formControlName="email"
               placeholder="Email"
               [class.is-invalid]="f.email.touched && f.email.invalid" />
      </div>
      <span class="nx-error" *ngIf="f.email.touched && f.email.invalid">Enter a valid email address.</span>
    </div>

    <div class="nx-field auth-field-gap">
  <label class="nx-label" for="password">Password</label>
  <div class="nx-input-wrap">
    <span class="nx-input-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </span>
    <input [type]="showPassword ? 'text' : 'password'" id="password" class="nx-input nx-input--with-toggle" formControlName="password"
           placeholder="password"
           [class.is-invalid]="f.password.touched && f.password.invalid" />
    <button type="button" class="nx-input-toggle" (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
      <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.4 18.4 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
  </div>
  <span class="nx-error" *ngIf="f.password.touched && f.password.invalid">Password must be at least 6 characters.</span>
</div>

    <div class="auth-forgot">
      <a routerLink="/forgot-password">Forgot password?</a>
    </div>

    <button type="submit" class="nx-btn nx-btn--primary nx-btn--block" >
      <span>Login</span>
    </button>
  </form>

  <div class="auth-google-btn mt-2">
    <div #googleButton class="auth-google-rendered"></div>
    <button
      type="button"
      class="nx-btn nx-btn--block auth-google-fallback"
      *ngIf="googleLoading"
      disabled
    >
      <span>Signing in...</span>
    </button>
  </div>

  <p class="auth-terms">By continuing, you agree to our Terms of Service and Privacy Policy.</p>
</div>
