<div class="auth">
  <!-- Left: decorative analytics panel (recreation of the reference art) -->
  <aside class="auth__art">
    <div class="art-overlay"></div>
    <div class="art-inner">
      <div class="art-block">
        <span class="art-caption">DAYS USING MEDIAN ▾</span>
        <div class="art-line-chart">
          <svg viewBox="0 0 320 120" preserveAspectRatio="none">
            <polyline points="0,90 40,80 80,84 120,60 160,64 200,48 240,52 280,40 320,42"
                      fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
          </svg>
        </div>
      </div>

      <div class="art-block">
        <span class="art-caption">START RENDER VS BOUNCE RATE</span>
        <div class="art-bars">
          <span *ngFor="let h of bars" [style.height.%]="h"></span>
        </div>
      </div>

      <div class="art-stats">
        <div class="art-stat"><b>2.7M</b><small>Page Views</small></div>
        <div class="art-stat"><b>40.6%</b><small>Bounce Rate</small></div>
        <div class="art-stat"><b>479K</b><small>Sessions</small></div>
        <div class="art-stat"><b>17min</b><small>Session Length</small></div>
      </div>

      <div class="art-wave">
        <svg viewBox="0 0 400 120" preserveAspectRatio="none">
          <path d="M0,80 C60,40 120,110 200,70 C280,30 340,90 400,60"
                fill="none" stroke="rgba(96,165,250,0.6)" stroke-width="2.5" />
          <path d="M0,95 C70,70 130,120 210,90 C300,55 360,100 400,85"
                fill="none" stroke="rgba(167,139,250,0.5)" stroke-width="2.5" />
        </svg>
      </div>
    </div>
  </aside>

  <!-- Right: form outlet (login / signup) -->
  <section class="auth__panel">
    <div class="auth__panel-inner">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
