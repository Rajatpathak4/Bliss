<div class="profile-page" *ngIf="user">
  <a class="back-link" routerLink="/dashboard">
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    Back to Dashboard
  </a>

  <div class="nx-card profile-card">
    <div class="profile-card__cover">
      <button class="edit-btn" (click)="toggleEdit()" type="button">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          ></path>
          <path
            d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
          ></path>
        </svg>
        {{ editMode ? "Cancel" : "Edit Profile" }}
      </button>
    </div>

    <div class="profile-card__body">
      <div class="avatar-wrap">
        <img
          *ngIf="previewUrl || avatarFullUrl"
          [src]="previewUrl || avatarFullUrl"
          class="nx-avatar profile-card__avatar profile-card__avatar--img"
          alt="Profile photo"
        />
        <span
          *ngIf="!previewUrl && !avatarFullUrl"
          class="nx-avatar profile-card__avatar"
          >{{ user.avatarInitials }}</span
        >

        <label *ngIf="editMode" class="avatar-upload-btn" for="avatarInput">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
            ></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </label>
        <input
          id="avatarInput"
          type="file"
          accept="image/png, image/jpeg, image/webp"
          hidden
          (change)="onFileSelected($event)"
        />
      </div>

      <ng-container *ngIf="!editMode">
        <h2 class="profile-card__name">{{ user.fullName }}</h2>
        <p class="profile-card__role">{{ user.role }} · {{ user.company }}</p>

        <div class="info-grid">
          <div class="info">
            <span class="info__label"
              ><svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <polyline points="22,6 12,13 2,6"></polyline></svg
              >Email</span
            >
            <span class="info__value">{{ user.email }}</span>
          </div>
          <div class="info">
            <span class="info__label"
              ><svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                ></path></svg
              >Phone</span
            >
            <span class="info__value">{{ user.phone_number }}</span>
          </div>
          <div class="info">
            <span class="info__label"
              ><svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <line x1="9" y1="13" x2="15" y2="13"></line></svg
              >Company</span
            >
            <span class="info__value">{{ user.company }}</span>
          </div>
          <div class="info">
            <span class="info__label"
              ><svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle></svg
              >Location</span
            >
            <span class="info__value">{{ user.location }}</span>
          </div>
        </div>
      </ng-container>

      <form
        *ngIf="editMode"
        [formGroup]="form"
        (ngSubmit)="save()"
        class="edit-form"
      >
        <div class="nx-field">
          <label class="nx-label">Full Name</label>
          <input
            class="nx-input"
            formControlName="name"
            [class.is-invalid]="f.name.touched && f.name.invalid"
          />
        </div>
        <div class="nx-field">
          <label class="nx-label">Email</label>
          <input
            class="nx-input"
            formControlName="email"
            [class.is-invalid]="f.email.touched && f.email.invalid"
          />
        </div>
        <div class="nx-field">
          <label class="nx-label">Phone Number</label>
          <input class="nx-input" formControlName="phone_number" />
        </div>
        <div class="nx-field">
          <label class="nx-label">Company</label>
          <input class="nx-input" formControlName="company" />
        </div>
        <div class="nx-field">
          <label class="nx-label">Location</label>
          <input class="nx-input" formControlName="location" />
        </div>

        <div class="edit-form__actions mt-2">
          <button
            type="button"
            class="nx-btn nx-btn--subtle me-2"
            (click)="toggleEdit()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="nx-btn nx-btn--primary"
            [disabled]="saving || uploading"
          >
            {{ saving || uploading ? "Saving..." : "Save Changes" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
