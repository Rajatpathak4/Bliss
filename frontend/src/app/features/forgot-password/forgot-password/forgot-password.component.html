<app-navbar></app-navbar>

<div class="fp-page">
  <a class="back-link" (click)="goBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    Back
  </a>

  <div class="nx-card fp-card">
    <!-- Stepper -->
    <div class="stepper">
      <ng-container *ngFor="let s of steps; let i = index">
        <div class="stepper__step" [class.active]="step >= s.n">
          <span class="stepper__num">{{ s.n }}</span>
          <span class="stepper__label">{{ s.label }}</span>
        </div>
        <span class="stepper__line" *ngIf="i < steps.length - 1" [class.active]="step > s.n"></span>
      </ng-container>
    </div>

    <div class="fp-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"></rect><polyline points="22,6 12,13 2,6"></polyline>
      </svg>
    </div>

    <!-- Step 1: email -->
    <ng-container *ngIf="step === 1">
      <h2 class="fp-title">Forgot your password?</h2>
      <p class="fp-sub">Enter your account email and we'll send a verification code.</p>
      <form [formGroup]="emailForm" (ngSubmit)="sendCode()" novalidate>
        <div class="nx-field">
          <label class="nx-label">Email address</label>
          <div class="nx-input-wrap">
            <span class="nx-input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><polyline points="22,6 12,13 2,6"></polyline></svg></span>
            <input class="nx-input" formControlName="email" placeholder="admin@nexadmin.io" />
          </div>
        </div>
        <button type="submit" class="nx-btn nx-btn--primary nx-btn--block fp-submit" [disabled]="loading">
          <ng-container *ngIf="!loading">Send Code
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </ng-container>
          <span *ngIf="loading">Sending…</span>
        </button>
      </form>
    </ng-container>

    <!-- Step 2: verify -->
    <ng-container *ngIf="step === 2">
      <h2 class="fp-title">Enter verification code</h2>
      <p class="fp-sub">{{ message || 'Check your inbox for the 6-digit code.' }}</p>
      <form [formGroup]="codeForm" (ngSubmit)="verifyCode()" novalidate>
        <div class="nx-field">
          <label class="nx-label">Verification code</label>
          <input class="nx-input" formControlName="code" placeholder="123456" maxlength="6" />
        </div>
        <button type="submit" class="nx-btn nx-btn--primary nx-btn--block fp-submit">Verify</button>
      </form>
    </ng-container>

    <!-- Step 3: reset -->
    <ng-container *ngIf="step === 3">
      <h2 class="fp-title">Set a new password</h2>
      <p class="fp-sub">Choose a strong password you haven't used before.</p>
      <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" novalidate>
        <div class="nx-field">
          <label class="nx-label">New password</label>
          <input class="nx-input" type="password" formControlName="password" placeholder="••••••••" />
        </div>
        <div class="nx-field fp-gap">
          <label class="nx-label">Confirm password</label>
          <input class="nx-input" type="password" formControlName="confirmPassword" placeholder="••••••••" />
        </div>
        <p class="nx-error fp-msg" *ngIf="message">{{ message }}</p>
        <button type="submit" class="nx-btn nx-btn--primary nx-btn--block fp-submit" [disabled]="loading">
          <span *ngIf="!loading">Reset Password</span>
          <span *ngIf="loading">Saving…</span>
        </button>
      </form>
    </ng-container>
  </div>
</div>
