<!-- KPI cards -->
<section class="stats">
  <div class="stat-card nx-card" *ngFor="let s of stats">
    <div class="stat-card__top">
      <span class="stat-card__label">{{ s.label }}</span>
      <span class="stat-card__icon" [ngClass]="'stat-card__icon--' + s.accent">
        <ng-container [ngSwitch]="s.icon">
          <svg *ngSwitchCase="'users'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <svg *ngSwitchCase="'clock'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <svg *ngSwitchCase="'card'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
          <svg *ngSwitchDefault width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        </ng-container>
      </span>
    </div>
    <div class="stat-card__value">{{ s.value }}</div>
    <div class="stat-card__hint" [ngClass]="'stat-card__hint--' + s.trend">
      <svg *ngIf="s.trend === 'up'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
      <svg *ngIf="s.trend === 'flat'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      {{ s.hint }}
    </div>
  </div>
</section>

<!-- Charts row 1 -->
<section class="charts">
  <div class="chart-card nx-card chart-card--wide">
    <div class="chart-card__head">
      <div>
        <h3 class="chart-card__title">Revenue &amp; Premium Completions</h3>
        <p class="chart-card__sub">Last 6 months</p>
      </div>
      <span class="chart-card__tag">Spline</span>
    </div>
    <highcharts-chart *ngIf="!loading"
      [Highcharts]="Highcharts"
      [options]="revenueChart"
      style="width:100%; height:320px; display:block;">
    </highcharts-chart>
  </div>

  <div class="chart-card nx-card">
    <div class="chart-card__head">
      <div>
        <h3 class="chart-card__title">Active Users</h3>
        <p class="chart-card__sub">Monthly growth trend</p>
      </div>
    </div>
    <highcharts-chart *ngIf="!loading"
      [Highcharts]="Highcharts"
      [options]="activeUsersChart"
      style="width:100%; height:320px; display:block;">
    </highcharts-chart>
  </div>
</section>

<!-- Charts row 2 -->

      </div>
    </div>
    <highcharts-chart *ngIf="!loading"
      [Highcharts]="Highcharts"
      [options]="premiumDueChart"
      style="width:100%; height:320px; display:block;">
    </highcharts-chart>

  <div class="chart-card nx-card">
    <div class="chart-card__head">
      <div>
        <h3 class="chart-card__title">New Client Acquisitions</h3>
        <p class="chart-card__sub">Onboarded per month</p>
      </div>
    </div>
    <highcharts-chart *ngIf="!loading"
      [Highcharts]="Highcharts"
      [options]="newClientsChart"
      style="width:100%; height:320px; display:block;">

  </div>
</section>
